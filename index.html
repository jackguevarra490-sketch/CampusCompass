<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City College of San Jose Del Monte - Campus Compass</title>
  <meta name="description" content="CCSJDM Student Portal with Cloudflare DNS & Pages deployment." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23be185d'/%3E%3Cpath d='M50 20 L20 35 L50 50 L80 35 Z' fill='%23fbbf24'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fdf2f8', 600: '#db2777', 700: '#be185d', 800: '#9d174d' },
            cf: { orange: '#f38020', gray: '#2c7cb0' }
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel Standalone (No Node.js build step needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans select-none overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, createContext, useContext } = React;

    // --- Embedded Vector Icons ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const svgs = {
        compass: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>,
        map: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>,
        calendar: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
        cloud: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
        zap: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
        download: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      };
      return <span className={`inline-flex items-center justify-center ${className}`}>{svgs[name] || svgs.compass}</span>;
    };

    // --- Domain & Cloudflare Context ---
    const DomainContext = createContext(null);
    const DomainProvider = ({ children }) => {
      const [domain, setDomain] = useState('ccsjdm.com');
      const [project, setProject] = useState('ccsjdm-compass');
      const [proxied, setProxied] = useState(true);

      const downloadFile = (name, content) => {
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <DomainContext.Provider value={{ domain, setDomain, project, setProject, proxied, setProxied, downloadFile }}>
          {children}
        </DomainContext.Provider>
      );
    };

    // --- Main Shell ---
    const App = () => {
      const [tab, setTab] = useState('dashboard');
      const { domain, project, proxied, setProxied, downloadFile } = useContext(DomainContext);

      return (
        <div className="h-screen flex flex-col md:flex-row">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-white p-4 flex flex-col justify-between hidden md:flex">
            <div className="space-y-6">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 bg-pink-700 rounded-xl flex items-center justify-center font-black">CC</div>
                <div>
                  <h1 className="text-xs font-bold">CCSJDM Compass</h1>
                  <p className="text-[10px] text-pink-400">San Jose Del Monte</p>
                </div>
              </div>
              <nav className="space-y-1">
                {['dashboard', 'map', 'schedule', 'grades', 'events', 'cloudflare'].map((id) => (
                  <button
                    key={id}
                    onClick={() => setTab(id)}
                    className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold capitalize transition ${
                      tab === id ? 'bg-pink-700 text-white font-bold' : 'text-slate-400 hover:bg-slate-800'
                    }`}
                  >
                    {id === 'cloudflare' ? 'Cloudflare DNS' : id}
                  </button>
                ))}
              </nav>
            </div>
            <div className="p-3 bg-slate-800 rounded-xl text-[11px] space-y-1">
              <div className="flex items-center justify-between">
                <span className="text-orange-400 font-bold flex items-center gap-1">
                  <Icon name="cloud" className="w-3 h-3" /> Cloudflare
                </span>
                <span className="text-emerald-400 font-bold">Active</span>
              </div>
              <p className="font-mono text-slate-400 text-[10px] truncate">{project}.pages.dev</p>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col overflow-hidden">
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between">
              <span className="font-bold text-sm text-slate-800">City College of San Jose Del Monte</span>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-1 bg-orange-50 border border-orange-200 text-orange-800 rounded-lg text-xs font-mono font-bold flex items-center gap-1.5">
                  <Icon name="cloud" className="w-3.5 h-3.5 text-orange-500" />
                  {domain}
                </span>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-6 space-y-6">
              {tab === 'dashboard' && (
                <div className="space-y-4">
                  <div className="p-6 bg-gradient-to-r from-pink-700 to-orange-500 text-white rounded-2xl shadow">
                    <h2 className="text-2xl font-black">Welcome, CCSJDM Scholar!</h2>
                    <p className="text-xs text-pink-100 mt-1">First Semester A.Y. 2026-2027 • Cloudflare Edge Active</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <p className="text-[11px] font-bold text-slate-400 uppercase">Current Term GWA</p>
                      <p className="text-2xl font-black text-pink-600">1.25</p>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <p className="text-[11px] font-bold text-slate-400 uppercase">Enrolled Units</p>
                      <p className="text-2xl font-black text-slate-800">12 Units</p>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-slate-200">
                      <p className="text-[11px] font-bold text-slate-400 uppercase">Next Lecture</p>
                      <p className="text-xs font-bold text-slate-800 mt-1">IT101 • ITC Lab 2</p>
                    </div>
                  </div>
                </div>
              )}

              {tab === 'cloudflare' && (
                <div className="space-y-4">
                  <div className="p-5 bg-slate-900 text-white rounded-xl space-y-3">
                    <h3 className="font-bold text-sm text-orange-400">Cloudflare DNS & CNAME Flattening</h3>
                    <p className="text-xs text-slate-300">
                      Apex domain <code className="text-orange-300">{domain}</code> is configured to point directly to <code className="text-orange-300">{project}.pages.dev</code>.
                    </p>
                    <div className="flex gap-2">
                      <button
                        onClick={() => downloadFile('ccsjdm-dns.txt', `@ IN CNAME ${project}.pages.dev.`)}
                        className="px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold rounded-lg cursor-pointer"
                      >
                        Download DNS Zone
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    };

    const Root = () => (
      <DomainProvider>
        <App />
      </DomainProvider>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
  </html>
